name: Keep Render APIs Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, UTC
  workflow_dispatch:          # lets you trigger it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all Render APIs
        env:
          URLS: ${{ secrets.RENDER_API_URLS }}
        run: |
          IFS=','
          for url in $URLS; do
            # trim leading/trailing whitespace
            url=$(echo "$url" | xargs)
            echo "Pinging $url ..."
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "  -> status: $code"
          done
