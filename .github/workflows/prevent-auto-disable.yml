name: Prevent Scheduled Workflow Auto-Disable

# GitHub auto-disables scheduled workflows after 60 days of repo inactivity.
# This workflow commits an empty commit once a month so keep-api-alive
# keeps running indefinitely. (You can also disable it by adding activity
# to the repo manually — this just makes it automatic.)
on:
  schedule:
    # 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch repo to keep scheduled workflows enabled
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows alive ($(date -u '+%Y-%m-%d'))"
          git push
