name: Keep APIs Alive

# Triggers:
#   1. Every 10 minutes on a schedule
#   2. Manually from the Actions tab (workflow_dispatch)
on:
  schedule:
    # GitHub Actions cron syntax (5 fields, UTC):
    #   minute hour day-of-month month day-of-week
    # "*/10 * * * *" = every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API
        env:
          # Read the URL from a repository secret so it is never logged.
          # Create it in: Settings -> Secrets and variables -> Actions -> New repository secret
          # Name:  API_URL
          # Value: https://your-service-domain.example.com/health
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -euo pipefail

          if [ -z "${API_URL}" ]; then
            echo "::error::API_URL secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Pinging ${API_URL} at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # --fail:        fail the step on HTTP 4xx/5xx
          # --silent:      no progress bar
          # --show-error:  still print errors
          # --max-time 30: never hang longer than 30s (cold start tolerance)
          # --retry 3:     retry on transient errors
          # --retry-delay 5: wait 5s between retries (gives cold start time)
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            "${API_URL}"

          echo "Ping succeeded at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
