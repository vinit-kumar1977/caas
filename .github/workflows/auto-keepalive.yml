name: Prevent Scheduled Workflow Auto-Disable

on:
  schedule:
    - cron: "0 0 1,15 * *"   # 1st and 15th of each month, UTC
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-keepalive
          git commit -m "chore: keepalive bump $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
